server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 嚴禁快取，確保部署新版本時客戶端能立即取得最新 JS bundle hash
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite 產出的帶 hash 靜態資源使用長快取；遺失時直接回 404，嚴禁 fallback 到 index.html 引發語法錯誤
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /products/:id 直接拜訪由前端路由接手（回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 與上傳圖片轉發給 Express 後端（compose 服務名 server）
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 圖片上傳上限 5MB，這裡放寬一點留餘裕
        client_max_body_size 6m;
    }

    # 轉送 CSP header（Express 已設定，避免被 nginx 移除）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
}
