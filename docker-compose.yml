services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      # 未在 .env 設定就拒絕啟動，避免用預設密碼上線
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?請先複製 .env.example 為 .env 並設定 ADMIN_PASSWORD}
    volumes:
      # SQLite 資料庫與上傳圖片持久化（shop.db、uploads/）
      - server-data:/app/data
    # 僅供 compose 內部網路存取，不對外開 port
    expose:
      - "3001"

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  server-data:
